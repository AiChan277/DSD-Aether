doc = false

[[bin]]
name = "fuzz_pmx"
path = "fuzz_targets/fuzz_pmx.rs"
test = false
doc = false

[[bin]]
name = "fuzz_project_toml"
path = "fuzz_targets/fuzz_project_toml.rs"
test = false
doc = false

[[bin]]
name = "fuzz_graph_json"
