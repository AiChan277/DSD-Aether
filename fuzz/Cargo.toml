edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
aether-asset-loader = { path = "../crates/aether-asset-loader" }
aether-plugin-host = { path = "../crates/aether-plugin-host" }

