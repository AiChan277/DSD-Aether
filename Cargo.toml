[workspace]
members = [
    "crates/aether-ffi",
    "crates/aether-asset-pmx",
    "crates/aether-asset-loader",
    "crates/aether-plugin-host",
    "crates/aether-rust-host",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
# Internal workspace crates are proprietary and unpublished.
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
gltf = { version = "=1.4.1", default-features = false, features = ["extensions", "extras", "names", "utils", "KHR_materials_unlit", "KHR_texture_transform"] }
ufbx = "=0.11.5"
rayon = "=1.12.0"
glam = "=0.34.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zune-png = "=0.5.2"
zune-jpeg = "=0.5.15"
memmap2 = "=0.9.12"
unicode-normalization = "=0.1.26"
encoding_rs = "=0.8.44"
ahash = "=0.8.12"
proptest = "=1.12.0"
wasmtime = { version = "=36.0.20", default-features = false, features = ["cranelift", "component-model", "wat", "runtime", "std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util"] }
rosc = { version = "=0.11.4", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
toml = "=1.2.1"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind" # REQUIRED: catch_unwind at every extern "C" boundary (HR-04)
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2 # dependencies optimised in dev so parsers and bake stay fast
