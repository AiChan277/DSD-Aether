language = "C"
cpp_compat = true
pragma_once = true
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
style = "both"
documentation = true
documentation_style = "c"
tab_width = 4
line_length = 100

header = """/* include/aether_ffi_contract.h - GENERATED by cbindgen from crates/aether-ffi. DO NOT EDIT.
 * Verified by tests/cpp/ffi_layout_test.cpp and crates/aether-ffi/src/layout_asserts.rs */"""

after_includes = """#if defined(__cplusplus)
#  define AETHER_ALIGNED(n) alignas(n)
#elif defined(_MSC_VER)
#  define AETHER_ALIGNED(n) __declspec(align(n))
#else
#  define AETHER_ALIGNED(n) __attribute__((aligned(n)))
#endif
#if defined(_MSC_VER)
#  pragma warning(push)
#  pragma warning(disable: 4324)
#endif"""

trailer = """#if defined(_MSC_VER)
#  pragma warning(pop)
#endif"""

[layout]
aligned_n = "AETHER_ALIGNED"

[export]
include = [
    "AetherStatus",
    "AetherRuntimeConfig",
    "AetherLoadRequest",
    "AetherLoaderOpaque",
    "AetherLoaderHandle",
    "AetherAssetRequirements",
    "AetherArenaSlice",
    "AetherAvatarDesc",
    "AetherHostConfig",
    "AetherHostOpaque",
    "AetherHostHandle",
    "AetherHostCommand",
    "AetherHostEvent",
    "AetherGraphPlanStats",
    "AetherGraphTelemetryReadout",
    "AetherPlanOpaque",
    "AetherPlanHandle",
    "AetherTrackingFrame",
    "AetherGraphInputs",
    "AetherGraphOutputs",
    "AetherVertex25D",
    "AetherVertexSurface",
    "AetherVertexSkin",
    "AetherMorphDelta",
    "AetherDspSyncPacket",
    "AetherMorphRangeDesc",
    "AetherSubmeshDesc",
    "AetherNprMaterial",
    "AetherJointDesc",
    "AetherSpringJointDesc",
    "AetherColliderDesc",
    "AetherExpressionBindingDesc",
    "AetherTextureDesc",
]

[parse]
parse_deps = false
expand = { crates = [] }

[fn]
prefix = "extern "
